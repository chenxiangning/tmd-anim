[package]
name = "tmd-anim"
version = "0.1.7"
description = "Technical animation video studio"
authors = ["Chen Xiangning"]
license = "MIT"
repository = "https://github.com/chenxiangning/tmd-anim"
homepage = "https://github.com/chenxiangning/tmd-anim"
publish = false
edition = "2021"

[lib]
name = "tmd_anim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
# 应用内自动更新:GitHub latest.json 通道(minisign 签名产物,密钥与 tmd-cli 共用)
tauri-plugin-updater = "2"
# 更新安装后重启
tauri-plugin-process = "2"
# 设置页外链用系统浏览器打开
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
