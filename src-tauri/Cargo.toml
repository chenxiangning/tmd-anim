[package]
name = "tmd-anim"
version = "0.1.0"
description = "Technical animation video studio"
authors = ["Chen Xiangning"]
edition = "2021"

[lib]
name = "tmd_anim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
