name: Release

# 触发方式:
#   1. 推送 v* 形式的 tag (v0.1.0 / v1.2.3-rc1) → 自动跑
#   2. 手动从 GitHub Actions UI 触发 (Run workflow)
# 发版流程见 README「版本与发布」:CHANGELOG 追加小节 → 三处版本号同步 → 推 tag。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 同一 tag 触发的重复 build 别互相取消 — 产物可能要发 Release
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# GITHUB_TOKEN 仅授予 contents 写:tauri-action 建 Draft Release / 上传产物所需。
# 公证凭据(APPLE_*)仅当 repo secrets 已配置才注入 macOS 构建步;未配置 = 未签名
# 未公证,产物为 ad-hoc 封签(与本地构建一致)。
permissions:
  contents: write

jobs:
  # 前置单 job 先建 Draft:tauri-action 的 getOrCreateRelease 有并发建重窗口
  # (GitHub 允许同 tag 多 draft,产物会静默分家),先建好大家只复用。
  prep-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    # CHANGELOG 小节经 releaseBody 注入 tauri-action:Release 正文与
    # latest.json 的 notes(应用内更新弹窗内容)共用同一事实源
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # 发版铁律:Release 正文必须携带 CHANGELOG 对应版本小节,禁「Automated build」
      # 占位。keep-a-changelog 标题「## [x.y.z] - 日期」,抠到下一个「## 」为止;
      # 缺小节回落占位并告警。
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            $0 ~ "^## \\[" ver "\\]" {flag = 1; next}
            flag && /^## / {exit}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Automated build. See commit log for changes." > release-notes.md
            echo "::warning::CHANGELOG.md 无 [$VER] 小节,Release 正文回落占位文案"
          fi
          {
            echo "notes<<TMD_NOTES_EOF"
            cat release-notes.md
            echo "TMD_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # 同 tag 重跑会复用旧 release。tauri-action 对 latest.json 有
            # "don't overwrite native builds" 守卫,残留的旧 latest.json 会让
            # 新签名条目写不进去 → 应用内更新验签失败(tmd-cli v0.2.3 实证)。
            # 先删 latest.json,本轮全平台条目重新生成。
            if gh release delete-asset "$GITHUB_REF_NAME" latest.json \
              --repo "$GITHUB_REPOSITORY" -y > /dev/null 2>&1; then
              echo "已删除陈旧 latest.json"
            else
              echo "无 latest.json 或已删,继续"
            fi
            # 同 tag 重跑会复用旧 release,正文刷成 CHANGELOG 小节(以 CHANGELOG 为唯一事实源)
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md \
              --repo "$GITHUB_REPOSITORY" > /dev/null
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "tmd-anim $GITHUB_REF_NAME" \
              --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          fi

  build:
    needs: prep-release
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/v') || needs.prep-release.result == 'skipped') }}
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false # 某个平台挂了不影响其他平台产物落地
      matrix:
        include:
          - platform: macos-latest
            tauri-target: aarch64-apple-darwin
            label: "macOS (aarch64)"
          - platform: macos-latest
            tauri-target: x86_64-apple-darwin
            label: "macOS (x86_64)"
          - platform: windows-latest
            tauri-target: x86_64-pc-windows-msvc
            label: "Windows (x86_64)"
        # Linux 暂不发布,需要时补回本行并恢复「Tauri Linux 系统依赖」步:
        #   - platform: ubuntu-latest
        #     tauri-target: x86_64-unknown-linux-gnu
        #     label: "Linux (x86_64)"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ---------- 前端 ----------
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # tauri-action 会自动跑 tauri.conf.json 里的 beforeBuildCommand (= pnpm build),
      # 不用在这里手动 pnpm build,避免重复构建。

      # ---------- Rust ----------
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.tauri-target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # macOS 代码签名 + 公证凭据注入:repo secrets 配齐才生效,缺任一即整组跳过。
      # 未注入时 tauri.conf 的 signingIdentity "-" 兜底为 ad-hoc 封签。所需 secrets:
      #   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
      #   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
      - name: macOS 签名/公证凭据注入(未配 secret 则跳过)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for k in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "$(eval "echo \$$k")" ]; then missing="$missing $k"; fi
          done
          if [ -n "$missing" ]; then
            echo "未配齐签名/公证凭据(缺:$missing),跳过注入(产物保持 ad-hoc 签名未公证)"
            exit 0
          fi
          {
            for k in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                     APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              v=$(eval "echo \$$k")
              printf '%s<<TMD_EOF\n%s\nTMD_EOF\n' "$k" "$v"
            done
          } >> "$GITHUB_ENV"

      # tauri-apps/tauri-action 是 Tauri 官方 GitHub Action,跨平台 build + 签名 + 上传。
      # tagName 动态取值:推送 v* tag 时非空 → 挂产物到 prep-release 建好的 Draft Release;
      # workflow_dispatch 手动触发时为空串 → 只构建,产物由下一步 upload-artifact 兜底落面板。
      - name: Build installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # updater 通道 minisign 私钥(与 tmd-cli 共用密钥对,空密码)。
          # 注入后 tauri-action 自动产出 .sig 签名产物与 latest.json;
          # secret 未配置时构建仍成功,仅更新通道无产物。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('tmd-anim {0}', github.ref_name) || '' }}
          releaseBody: ${{ needs.prep-release.outputs.notes || 'Automated build. See commit log for changes.' }}
          releaseDraft: true
          args: --target ${{ matrix.tauri-target }}

      # 手动触发兜底:tauri-action 无 tagName 时产物不上传,job 结束即丢。
      - name: 上传构建产物(仅手动触发)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: tmd-anim-bundle-${{ matrix.tauri-target }}
          path: src-tauri/target/${{ matrix.tauri-target }}/release/bundle/

  # latest.json 由 tauri-action 生成,资产 URL 默认指向 api.github.com/releases/assets/<id>:
  # 该端点匿名配额仅 60 次/小时/IP,超限后更新器下载一律 403(v0.1.4 发布日实证)。
  # 此 job 把全部资产 URL 改写为 github.com/releases/download 直链(CDN 承载,无此配额);
  # 签名不受影响——minisign 签名内嵌在 latest.json 的 signature 字段,与下载 URL 无关。
  # 注意:此刻 release 仍是草稿,按 tag 的 /releases/tags/<tag> 端点看不见草稿(v0.1.5 实证
  # 404),全程按 release ID 操作;资产上传必须走 uploads.github.com 裸二进制体,
  # gh api -F 的 multipart 会被 404。
  patch-latest:
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: 改写 latest.json 资产 URL 为 github.com 直链
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api "repos/$REPO/releases?per_page=100" > releases.json
          REL_ID=$(TAG="$TAG" python3 -c '
          import json, os, sys
          tag = os.environ["TAG"]
          rels = json.load(open("releases.json"))
          rel = next((r for r in rels if r["tag_name"] == tag), None)
          if rel is None:
              sys.exit(f"找不到 tag 为 {tag} 的 release(含草稿)")
          print(rel["id"])
          ')
          gh api "repos/$REPO/releases/$REL_ID" > release.json
          LATEST_ID=$(python3 -c "import json;rel=json.load(open('release.json'));print(next(a['id'] for a in rel['assets'] if a['name']=='latest.json'))")
          gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$LATEST_ID" > latest.json
          REPO="$REPO" TAG="$TAG" python3 - <<'PY'
          import json, os
          repo, tag = os.environ["REPO"], os.environ["TAG"]
          rel = json.load(open("release.json"))
          id2name = {a["id"]: a["name"] for a in rel["assets"]}
          m = json.load(open("latest.json"))
          for plat in m["platforms"].values():
              url = plat.get("url", "")
              marker = "/releases/assets/"
              if marker in url:
                  aid = int(url.rsplit("/", 1)[1])
                  plat["url"] = f"https://github.com/{repo}/releases/download/{tag}/{id2name[aid]}"
          json.dump(m, open("latest.json", "w"), ensure_ascii=False, indent=2)
          left = [p["url"] for p in m["platforms"].values() if "api.github.com" in p["url"]]
          assert not left, f"仍有 api.github.com 地址: {left}"
          print("latest.json 资产 URL 已全部改为 github.com 直链")
          PY
          gh api -X DELETE "repos/$REPO/releases/assets/$LATEST_ID" > /dev/null
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @latest.json \
            "https://uploads.github.com/repos/$REPO/releases/$REL_ID/assets?name=latest.json" > /dev/null
          echo "已回传改写后的 latest.json"
